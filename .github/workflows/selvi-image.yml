name: Build Selvi Hospital Image

on:
  push:
    branches:
      - selvi-hospital
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Selvi branch
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Selvi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.selvi
          push: true
          tags: |
            ghcr.io/bfx-labs/selvi-v16:v16.1-selvi.1
            ghcr.io/bfx-labs/selvi-v16:v16.1-selvi-${{ github.sha }}

